<!DOCTYPE html><head><title>three.js sprite bench</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js" } }
</script>
<script src=gpuTimer.js></script>
<script src=benchOther.js></script>
<style>html, body { margin: 0; overflow: hidden } canvas { display: block }</style></head><body>
<canvas id=c></canvas>
<script type=module>
// n THREE.Sprite objects over a lit ground, the same scene as sprites.html; three.js draws each sprite with its own
// call and sorts them back to front like any transparent object
// ?n=10000 sets the count, ?sort=0 turns the sorting off, ?aa=0 antialiasing off, ?w=1280&h=720 fixes the canvas size
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;
const params = new URLSearchParams(location.search);
const n = +params.get('n') || 10000, aa = params.get('aa') !== '0';
const w = +params.get('w') || innerWidth, h = +params.get('h') || (params.get('w') ? 720 : innerHeight);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: aa });
renderer.setSize(w, h);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.sortObjects = params.get('sort') !== '0';
const scene = new THREE.Scene();
scene.background = new THREE.Color().setHSL(.6, .5, .8);
const camera = new THREE.PerspectiveCamera(60, w / h, .1, 1000);
camera.position.set(0, 40, 80);
camera.lookAt(0, 0, 0);
const sun = new THREE.DirectionalLight(0xffffff, Math.PI);
sun.position.set(-30, 100, 50);
scene.add(sun, new THREE.AmbientLight(0xffffff, .3 * Math.PI));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x808080 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const rand = (a, b)=> a + Math.random() * (b - a);
const map = await new THREE.TextureLoader().loadAsync('../examples/shorts/tiles.png');
map.colorSpace = THREE.NoColorSpace;
for (let i = 0; i < n; ++i)
{
    // one material per sprite carries its tint, as the LittleJS sprite's color does
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map, color: new THREE.Color().setHSL(Math.random(), .7, .6) }));
    sprite.position.set(rand(-60, 60), rand(.5, 8), rand(-60, 60));
    sprite.scale.set(1.5, 1.5, 1);
    scene.add(sprite);
}
benchRun('three.js sprites', n, renderer.getContext(), ()=> {}, ()=> renderer.render(scene, camera));
</script>
