<!DOCTYPE html><head>
<title>LittleJS Example Browser</title>
<link rel=icon type=image/png href=favicon.png>
<link rel=stylesheet href=style.css?12>
<meta charset=utf-8>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<meta name='color-scheme' content='dark'>
<!-- meta tags for social media -->
<meta name='twitter:title'       content='LittleJS Example Browser'>
<meta property='og:title'        content='LittleJS Example Browser'>
<meta name='description'         content='Tiny fast HTML5 game engine!'>
<meta name='twitter:description' content='Tiny fast HTML5 game engine!'>
<meta property='og:description'  content='Tiny fast HTML5 game engine!'>
<meta name='twitter:image'       content='https://3d2k.com/images/LittleJSExamples.png'>
<meta property='og:image'        content='https://3d2k.com/images/LittleJSExamples.png'>
<meta name='keywords'            content='JavaScript, HTML5, Game, Engine'>
<meta name='twitter:creator'     content='@KilledByAPixel'>
<meta name='twitter:card'        content='summary_large_image'>
</head><body>
<header id=topBar>
<a class=brand href='https://killedbyapixel.github.io/LittleJS/' title='LittleJS'><img src=logo.png alt=''>LittleJS <span>Examples</span></a>
<div id=titleInfo><b id=exampleName></b> <span id=exampleInfo></span></div>
<nav class=links>
<a id=exampleLink target=_blank rel=noopener title='This example on GitHub'>Source</a>
<a href='../docs/' target=_blank rel=noopener>Docs</a>
<a href='https://github.com/KilledByAPixel/LittleJS' target=_blank rel=noopener>GitHub</a>
</nav>
</header>
<main id=container1>
<section id=container3>
<div id=divCodeOptions>
<label>Theme <select id=selectTheme></select></label>
<label>Size <select id=selectFontSize>
    <option value=10px>XS</option>
    <option value=13px>S</option>
    <option value=16px selected>M</option>
    <option value=20px>L</option>
    <option value=24px>XL</option>
</select></label>
<span class=spacer></span>
<label class=nowrap><input type=checkbox id=checkboxLiveEdit checked>Live edit</label>
<label class=nowrap><input type=checkbox id=checkboxUseStrict>Use strict</label>
<label class=nowrap><input type=checkbox id=checkboxShowInfo checked>Show info</label>
</div>
<div id=divEditor>
<div id=divTextareas>
<textarea id=textareaCode spellcheck=false></textarea>
<textarea id=textareaError readonly spellcheck=false></textarea>
<textarea id=textareaConsole readonly spellcheck=false></textarea>
</div>
<div id=infoSplitter role=separator aria-orientation=horizontal aria-label='Resize the info box' tabindex=0 title='Drag to resize, double click to reset'></div>
<div id=exampleInfoBox></div>
</div>
</section>
<section id=container2>
<div id=iframeContainer></div>
<div id=divControls>
<button id=buttonPrev title='The example before this one'>&lsaquo; Prev</button>
<button id=buttonExamples title='Pick an example'><span id=buttonExamplesName></span></button>
<button id=buttonNext title='The example after this one'>Next &rsaquo;</button>
<span class=spacer></span>
<button id=buttonRestart title='Run the code again'>Restart</button>
<button id=buttonPause>Pause</button>
<button id=buttonFullscreen>Fullscreen</button>
<label class=nowrap title='Render with WebGL, or with Canvas2D when off'><input type=checkbox id=checkboxWebGL checked>WebGL</label>
</div>
<div id=listPanel>
<div id=listHeader>
<input id=inputSearch type=search placeholder='Search examples' autocomplete=off>
<button id=buttonListClose>Done</button>
</div>
<div id=listExamples role=listbox aria-label='Examples' tabindex=0></div>
</div>
</section>
</main>
<script src=../docs/search.js></script>
<script type=module src=shorts.js></script>
