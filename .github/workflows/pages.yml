name: Site

# The site, killedbyapixel.github.io/LittleJS, is the repo as it is on main with dist built from the source, so the
# live examples always run the engine they were written for. dist is committed only for a release.
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# the build runs npm install, so it reads only; the right to deploy is the deploy job's alone
permissions:
  contents: read

# one deploy at a time, a newer push takes the place of one still waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
        env:
          # the build never uses Electron, only examples/electron does
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      # the site is the repo's own files and the dist just built, not the tools that built it
      - run: rm -rf node_modules dist.build docs.build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
