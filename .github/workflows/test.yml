name: Test

on:
  push:
  pull_request:

# the job only reads the repo
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
        env:
          # Engine build/test never use Electron (only examples/electron does),
          # so skip its large binary download to avoid flaky CDN timeouts.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      # dist is committed, so fail a push whose bundles were not rebuilt from src;
      # only the concatenated bundles, which no floating tool version can change
      - name: Check the committed bundles match the source
        run: git diff --exit-code -- dist/littlejs.js dist/littlejs.esm.js dist/littlejs.release.js
      - run: npm test
      # real WebGL in the runner's own Chrome, headless with the software renderer
      - run: npm run test:browser
