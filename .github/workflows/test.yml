name: Test

on:
  push:
  pull_request:

# the job only reads the repo
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
        env:
          # Engine build/test never use Electron (only examples/electron does),
          # so skip its large binary download to avoid flaky CDN timeouts.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # dist is committed only for a release, so the tests run on a build of the source as it is
      - run: npm run build
      - run: npm test
      # real WebGL in the runner's own Chrome, headless with the software renderer
      - run: npm run test:browser
