<!DOCTYPE html><meta charset=utf-8>
<title>LittleJS smoke: 2D draws</title>
<script src=../../dist/littlejs.js></script>
<script src=smoke.js></script>
<pre id=result>PENDING</pre>
<script>
'use strict';

// the engine starts with WebGL and what it draws comes out in its colors: the clear color, a rectangle, a tile of a
// texture, and a tinted tile
smokeRun(async ()=>
{
    setShowSplashScreen(false);
    setDebugWatermark(false);
    setEngineManualStep(true);
    setCanvasFixedSize(vec2(64));
    setCanvasClearColor(rgb(0, 0, 1));
    let texture;
    await engineInit(()=>
    {
        setCameraScale(1); // a world unit is a pixel, the view 64 across

        // a plain green texture
        const canvas = new OffscreenCanvas(8, 8), context = canvas.getContext('2d');
        context.fillStyle = '#0f0';
        context.fillRect(0, 0, 8, 8);
        texture = new TextureInfo(canvas);
    }, ()=> {}, ()=> {}, ()=>
    {
        drawRect(vec2(-16, 16), vec2(16), rgb(1, 0, 0));                       // top left, red
        drawTile(vec2(16, 16), vec2(16), new TileInfo(vec2(), vec2(8), texture)); // top right, green
        drawTile(vec2(16, -16), vec2(16), new TileInfo(vec2(), vec2(8), texture), rgb(1, 1, 0), 0, false,
            rgb(0, 0, 1));                                                     // bottom right, green plus blue
    }, ()=> {});
    check('WebGL is on', glEnable && !!glContext);
    engineStep();
    checkPixel('the clear color shows', .25, .25, [0, 0, 255, 255]);
    checkPixel('a rectangle draws in its color', .25, .75, [255, 0, 0, 255]);
    checkPixel('a tile draws its texture', .75, .75, [0, 255, 0, 255]);
    checkPixel('a tile takes an additive color', .75, .25, [0, 255, 255, 255]);
    checkGLError();
});
</script>
