<!DOCTYPE html><meta charset=utf-8>
<title>LittleJS smoke: the 2D directional light</title>
<script src=../../dist/littlejs.js></script>
<script src=smoke.js></script>
<pre id=result>PENDING</pre>
<script>
'use strict';

// the 2D directional light: a sun from the left over a white floor, a block that throws a long shadow to the right, and
// a background area dark inside and lit at its left edge
// the view is 16 units across, so a place (x, y) is at (.5 + x / 16, .5 + y / 16) of the canvas; the block is at
// (-4, 0), 1 by 2, the background area spans x 1 to 7 and y -6.5 to -3.5
smokeRun(async ()=>
{
    setShowSplashScreen(false);
    setDebugWatermark(false);
    setEngineManualStep(true);
    setCanvasFixedSize(vec2(128));
    setCanvasClearColor(rgb(0, 0, 0));
    const bright = (x, y)=> smokePixel(.5 + x / 16, .5 + y / 16)[0];
    let block, back;
    await engineInit(()=>
    {
        setCameraScale(8);
        new LightSystemPlugin; // pitch dark where no light reaches
        block = new EngineObject(vec2(-4, 0), vec2(1, 2), tile(1, 16)); // white, it casts
        back = new EngineObject(vec2(4, -5), vec2(6, 3), tile(1, 16)); // white, a background area
        back.castShadow = false;
        back.castBackgroundShadow = true;
    }, ()=> {}, ()=> {}, ()=>
    {
        drawTile(vec2(), vec2(16), tile(1, 16)); // a white floor over the whole view
    }, ()=> {}, [smokeSheet('#888', '#fff')]);

    engineStep(3);
    check('with no directional light there is no background map', !lightSystem.backgroundMap);
    check('and the floor is dark', bright(-2, 3) < 40, bright(-2, 3));

    const sun = new DirectionalLight(vec2(1, 0), rgb(1, 1, 1));
    engineStep(3);
    check('a directional light makes the background map', !!lightSystem.backgroundMap);
    check('and the shadow map, with shadows off', !!lightSystem.shadowMap && !lightSystem.shadows);
    check('open floor is lit in the color of the light', bright(-6, 4) > 200, bright(-6, 4));
    check('the block throws a long shadow to its right', bright(0, 0) < 120, bright(0, 0));
    check('which fades the further it goes', bright(6, 0) > bright(0, 0) + 20, [bright(6, 0), bright(0, 0)]);
    check('above the shadow is lit', bright(0, 3) > 200, bright(0, 3));
    check('the side of the block facing the light is lit, its far side is not',
        bright(-4.4, 0) > bright(-3.6, 0) + 30, [bright(-4.4, 0), bright(-3.6, 0)]);
    check('the background area is lit at its edge facing the light', bright(1.3, -5) > 80, bright(1.3, -5));
    check('and dark inside', bright(6.5, -5) < 40, bright(6.5, -5));

    sun.direction = vec2(0, -1); // straight down
    engineStep(3);
    check('a vertical light casts straight down', bright(-4, -3) < 120 && bright(-2, -3) > 200,
        [bright(-4, -3), bright(-2, -3)]);

    // a lost context takes its textures with it, and they are made again once it is back
    sun.direction = vec2(1, 0);
    const lose = glContext.getExtension('WEBGL_lose_context');
    const event = (name)=> new Promise((resolve, reject)=>
    {
        glCanvas.addEventListener(name, resolve, {once: true});
        setTimeout(()=> reject(name + ' never came'), 3e3);
    });
    const lost = event('webglcontextlost');
    lose.loseContext();
    await lost;
    await new Promise((resolve)=> setTimeout(resolve)); // a restore is allowed only once the lost event is through
    engineStep(2);
    check('a lost context lets go of its textures', !lightSystem.directionalTexture && !lightSystem.backgroundMap);
    const restored = event('webglcontextrestored');
    lose.restoreContext();
    await restored;
    await new Promise((resolve)=> setTimeout(resolve));
    engineStep(3);
    check('and once it is back the light and its shadow draw again', bright(-6, 4) > 200 && bright(0, 0) < 120,
        [bright(-6, 4), bright(0, 0)]);

    sun.castShadow = false;
    engineStep(3);
    check('with castShadow off there is no long shadow', bright(0, 0) > 200, bright(0, 0));

    sun.destroy();
    engineStep(3);
    check('destroyed, it adds nothing', bright(-6, 4) < 40, bright(-6, 4));
    checkGLError();
});
</script>
