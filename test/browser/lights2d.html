<!DOCTYPE html><meta charset=utf-8>
<title>LittleJS smoke: the 2D light system</title>
<script src=../../dist/littlejs.js></script>
<script src=smoke.js></script>
<pre id=result>PENDING</pre>
<script>
'use strict';

// the 2D light system lights a white scene around a light and leaves the rest dark, and with shadows on an object
// in the way casts one
// the view is 8 units across, so a place (x, y) is at (.5 + x / 8, .5 + y / 8) of the canvas; the light is at
// (-2, 0), an object at (-.5, 0) between it and (1, 0); then the light turns to look right, a cone and a gel on it
smokeRun(async ()=>
{
    setShowSplashScreen(false);
    setDebugWatermark(false);
    setEngineManualStep(true);
    setCanvasFixedSize(vec2(128));
    setCanvasClearColor(rgb(0, 0, 0));
    const pixel = (x, y)=> smokePixel(.5 + x / 8, .5 + y / 8);
    const bright = (x, y)=> pixel(x, y)[0];
    let light;
    await engineInit(()=>
    {
        setCameraScale(16);
        new LightSystemPlugin; // pitch dark where no light reaches
        light = new Light(vec2(-2, 0), 6, rgb(1, 1, 1));
        light.castShadow = true;
        new EngineObject(vec2(-.5, 0), vec2(1), tile(0, 16)); // what casts the shadow
    }, ()=> {}, ()=> {}, ()=>
    {
        drawTile(vec2(), vec2(8), tile(1, 16)); // a white floor over the whole view
    }, ()=> {}, [smokeSheet('#888', '#fff', '#f00')]);

    engineStep(3);
    check('the floor is lit near the light', bright(-2, 1) > 120, bright(-2, 1));
    check('and dark far from it', bright(3.5, 3.5) < 40, bright(3.5, 3.5));
    const open = bright(1, 0);
    check('with shadows off the light goes past the object', open > 40, open);

    lightSystem.shadows = true;
    engineStep(3);
    const shadowed = bright(1, 0), beside = bright(-2, 3);
    check('with shadows on the object casts one', shadowed < open - 25, [shadowed, open]);
    check('as far from the light the other way it is still lit', beside > shadowed + 25, [beside, shadowed]);

    // a cone looking right, along the light's up turned a quarter clockwise, still with its shadow
    light.angle = PI/2;
    light.coneAngle = PI/3; // fading from 48 degrees out to 60
    engineStep(3);
    const ahead = bright(-1, 1), behind = bright(-3.5, 0), side = bright(-2, 2);
    check('a cone lights ahead of the light', ahead > 80, ahead);
    check('and not behind it or to its side', behind < 20 && side < 20, [behind, side]);
    check('its shadow still falls', bright(1, 0) < 20, bright(1, 0));
    light.coneAngle = 0;
    lightSystem.shadows = false;

    // a gel: a texture of four colors, its top the way the light looks, its right the light's right, which is down
    const canvas = document.createElement('canvas'), context = canvas.getContext('2d');
    canvas.width = canvas.height = 2;
    for (const [x, y, color] of [[0, 0, '#f00'], [1, 0, '#0f0'], [0, 1, '#00f'], [1, 1, '#00f']])
        context.fillStyle = color, context.fillRect(x, y, 1, 1);
    light.gel = new TextureInfo(canvas, true, false, true);
    engineStep(3);
    const [left, right, back] = [pixel(-.5, 1.5), pixel(-.5, -1.5), pixel(-3.5, .5)];
    check('a gel colors the light, its top left ahead and to the left', left[0] > 80 && left[1] < 20, left);
    check('its top right ahead and to the right', right[1] > 80 && right[0] < 20, right);
    check('its bottom behind', back[2] > 80 && back[0] < 20 && back[1] < 20, back);

    // a tile of a sheet is read alone, the white tile beside it does not bleed in
    light.gel = tile(2, 16);
    engineStep(3);
    const red = pixel(-2, 1.5);
    check('a gel tile is that tile alone', red[0] > 80 && red[1] < 10 && red[2] < 10, red);

    // a renderLight that throws hands the screen back: its framebuffer, its viewport and the blend
    const gl = glContext, thrower = new EngineObject(vec2(5));
    thrower.renderLight = ()=> { throw Error('on purpose'); };
    let thrown;
    try { engineStep(); } catch (e) { thrown = e.message; }
    const viewport = [...gl.getParameter(gl.VIEWPORT)];
    check('a throwing renderLight leaves the screen the target', thrown == 'on purpose' &&
        gl.getParameter(gl.FRAMEBUFFER_BINDING) === null && viewport[2] == glCanvas.width &&
        viewport[3] == glCanvas.height && !glAdditive, [thrown, viewport]);
    thrower.destroy();

    // and a renderEmissive that throws, with a Shader set, the same
    const glowing = new EngineObject(vec2(5));
    glowing.emissive = 1;
    glowing.shader = new Shader('void mainImage(out vec4 c, vec2 uv) { c = vec4(1.); }');
    glowing.renderEmissive = function() { drawTile(this.pos, vec2(1), tile(1, 16)); throw Error('on purpose'); };
    thrown = undefined;
    const shaderBefore = glCustomShader;
    try { engineStep(); } catch (e) { thrown = e.message; }
    const viewport2 = [...gl.getParameter(gl.VIEWPORT)];
    check('a throwing renderEmissive that drew with a Shader leaves the screen the target and the Shader as it was',
        thrown == 'on purpose' && gl.getParameter(gl.FRAMEBUFFER_BINDING) === null && viewport2[2] == glCanvas.width &&
        viewport2[3] == glCanvas.height && !glAdditive && glCustomShader === shaderBefore && drawContext === mainContext, [thrown, viewport2]);
    glowing.destroy();
    checkGLError();
});
</script>
