<!DOCTYPE html><meta charset=utf-8>
<title>LittleJS smoke: icons in text</title>
<script src=../../dist/littlejs.js></script>
<script src=smoke.js></script>
<pre id=result>PENDING</pre>
<script>
'use strict';

// an icon registered with setTextIcon draws in text where its name is: as tall as the text, placed by the alignment,
// squeezed with the text by maxWidth, in ImageFont text too, faded with its alpha, and as a shape of the shadow's color in a UI text shadow
// read from the main canvas, where text is drawn, in its pixels from the top left
smokeRun(async ()=>
{
    setShowSplashScreen(false);
    setDebugWatermark(false);
    setEngineManualStep(true);
    setCanvasFixedSize(vec2(128, 96));
    setCanvasClearColor(rgb(0, 0, 0));
    await engineInit(()=>
    {
        const canvas = new OffscreenCanvas(8, 8), context = canvas.getContext('2d');
        context.fillStyle = '#f00';
        context.fillRect(0, 0, 8, 8);
        setTextIcon('red', new TileInfo(vec2(), vec2(8), new TextureInfo(canvas)));
    }, ()=> {}, ()=> {}, ()=> {}, ()=>
    {
        drawTextScreen(':red:', vec2(4, 8), 16, WHITE, 0, BLACK, 'left');           // x 4 to 20
        drawTextScreen(':red:', vec2(124, 8), 16, WHITE, 0, BLACK, 'right');        // x 108 to 124
        drawTextScreen(':red::red:', vec2(4, 32), 16, WHITE, 0, BLACK, 'left', undefined, '', 16); // squeezed
        drawTextScreen(':red:', vec2(64, 56), 16, rgb(1, 1, 1, .5));                // centered, faded
        textIconsSilhouette = true;
        drawTextScreen(':red:', vec2(64, 80), 16, rgb(0, 0, 1));                     // a shadow's shape
        textIconsSilhouette = false;
        engineImageFont.drawTextScreen(':red:', vec2(100, 56), 16, false, WHITE, false); // x 92 to 108, on the canvas
    });
    engineStep();
    const pixel = (x, y)=> [...mainContext.getImageData(x, y, 1, 1).data];
    const near = (name, p, color)=> check(name, smokeNear(p, color), p);
    near('an icon draws its tile where it is written, aligned left', pixel(12, 8), [255, 0, 0, 255]);
    near('and to the left of the place, aligned right', pixel(116, 8), [255, 0, 0, 255]);
    near('maxWidth squeezes the line, two icons in the width of one', pixel(10, 32), [255, 0, 0, 255]);
    near('nothing past that width', pixel(26, 32), [0, 0, 0, 0]); // the main canvas is clear over the WebGL one
    near('an icon fades with the text, centered', pixel(64, 56), [255, 0, 0, 128]);
    near('ImageFont text shows it too, at its place', pixel(100, 56), [255, 0, 0, 255]);
    near("in a shadow it is a shape of the shadow's color", pixel(64, 80), [0, 0, 255, 255]);
});
</script>
