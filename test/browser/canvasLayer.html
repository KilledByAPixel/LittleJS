<!DOCTYPE html><meta charset=utf-8>
<title>LittleJS smoke: drawing into a canvas layer</title>
<script src=../../dist/littlejs.js></script>
<script src=smoke.js></script>
<pre id=result>PENDING</pre>
<script>
'use strict';

// a CanvasLayer draws into itself as a TileLayer does: a rect drawn in world space shows at that place in the world,
// on a WebGL layer and on one drawn with Canvas2D, a turned one and a mirrored one, and in layer pixels too
// the view is 8 units across with the origin in the middle, a unit 16 pixels, so a place (x, y) is at
// (.5 + x / 8, .5 + y / 8) of the canvas
smokeRun(async ()=>
{
    setShowSplashScreen(false);
    setDebugWatermark(false);
    setEngineManualStep(true);
    setCanvasFixedSize(vec2(128));
    setCanvasClearColor(rgb(0, 0, 1));
    setTilesPixelated(true);
    const pixel = (x, y)=> smokePixel(.5 + x / 8, .5 + y / 8);
    const red = rgb(1, 0, 0), green = rgb(0, 1, 0);
    let canvas2d, reference;
    await engineInit(()=>
    {
        setCameraScale(16);

        // 2 by 2 layers, 16 pixels a unit, a red quarter unit drawn at a world place near a corner of each
        const webgl = new CanvasLayer(vec2(-2.5, 2.5), vec2(2), 0, 0, vec2(32));
        webgl.drawRect(vec2(-3, 3), vec2(.5), red);
        canvas2d = new CanvasLayer(vec2(1.5, 2.5), vec2(2), 0, 0, vec2(32), false);
        canvas2d.drawRect(vec2(1, 3), vec2(.5), red);
        const turned = new CanvasLayer(vec2(-2.5, -1.5), vec2(2), PI/2, 0, vec2(32));
        turned.drawRect(vec2(-3, -1), vec2(.5), red);
        const mirrored = new CanvasLayer(vec2(1.5, -1.5), vec2(2), 0, 0, vec2(32));
        mirrored.mirror = true;
        mirrored.drawRect(vec2(1, -1), vec2(.5), red);

        // in layer pixels, inside redrawStart and redrawEnd, up from its bottom left: the top right quarter
        const pixels = new CanvasLayer(vec2(-1, -3.5), vec2(1), 0, 0, vec2(16));
        pixels.redrawStart();
        pixels.drawLayerRect(vec2(8, 8), vec2(8), green);
        pixels.redrawEnd();

        // a tile layer, by its corner, draws in world space as before
        const tiles = new TileLayer(vec2(2, -4), vec2(2), tile(0, 16));
        tiles.drawRect(vec2(2.5, -3.5), vec2(.5), red);
    }, ()=> {}, ()=> {}, ()=> { reference?.(); }, ()=> {}, [smokeSheet('#f00', '#0f0')]);

    engineStep(2);
    const isRed = ([r, g, b])=> r > 200 && g < 50 && b < 50;
    const isBlue = ([r, g, b])=> b > 200 && r < 50 && g < 50;
    const where = (name, at, empty)=> check(name, isRed(pixel(...at)) && isBlue(pixel(...empty)),
        [pixel(...at), pixel(...empty)]);
    where('a WebGL canvas layer draws a rect at its world place', [-3, 3], [-2, 2]);
    // a Canvas2D layer is drawn on the main canvas, so it is read on its own canvas: world (1, 3) is a half unit
    // in and a half down from its top left, pixel (8, 8) of 32
    const layerPixel = (x, y)=> [...canvas2d.context.getImageData(x, y, 1, 1).data];
    check('a Canvas2D canvas layer draws a rect at its world place', isRed(layerPixel(8, 8)) &&
        layerPixel(24, 24)[3] == 0, [layerPixel(8, 8), layerPixel(24, 24)]);
    where('a turned canvas layer draws a rect at its world place', [-3, -1], [-2, -2]);
    where('a mirrored canvas layer draws a rect at its world place', [1, -1], [2, -2]);
    check('a canvas layer draws in layer pixels inside redrawStart and redrawEnd',
        pixel(-.75, -3.25)[1] > 200 && isBlue(pixel(-1.25, -3.75)), [pixel(-.75, -3.25), pixel(-1.25, -3.75)]);
    where('a tile layer still draws a rect at its world place', [2.5, -3.5], [3.5, -2.5]);

    // a turned bar, which a wrong turn or flip of the tile itself would show along the other diagonal: drawn into
    // a turned layer and a mirrored one, it lies as the same bar drawn straight into the world does
    engineObjectsDestroy();
    const bar = (draw, at)=> draw(at, vec2(1.6, .3), red, PI/4);
    const turned = new CanvasLayer(vec2(-2, -1), vec2(3), PI/2, 0, vec2(48));
    bar((...a)=> turned.drawRect(...a), vec2(-2, -1));
    const mirrored = new CanvasLayer(vec2(2, -1), vec2(3), 0, 0, vec2(48));
    mirrored.mirror = true;
    bar((...a)=> mirrored.drawRect(...a), vec2(2, -1));
    reference = ()=> bar(drawRect, vec2(0, 2.5));
    engineStep(2);
    const lies = (x, y)=> [isRed(pixel(x + .3, y + .3)), isRed(pixel(x + .3, y - .3))];
    const straight = lies(0, 2.5);
    check('the bar drawn straight lies along one diagonal', straight[0] != straight[1], straight);
    check('a turned canvas layer turns a turned draw with it', '' + lies(-2, -1) == '' + straight,
        [lies(-2, -1), straight]);
    check('a mirrored canvas layer keeps a turned draw as it shows', '' + lies(2, -1) == '' + straight,
        [lies(2, -1), straight]);
    checkGLError();
});
</script>
