<!DOCTYPE html><meta charset=utf-8>
<title>LittleJS smoke: audio</title>
<!-- the audio graph running in a real browser, which the runner allows to play with no gesture: a zzfx sound heard
     through an analyser on the master bus, then through each effect, a negative volume silent, and a sound
     stopped -->
<script>
// shown and focused, as the one tab a player has, though the runner runs four at once in the background
Object.defineProperty(document, 'hidden', {get: ()=> false});
Object.defineProperty(document, 'visibilityState', {get: ()=> 'visible'});
document.hasFocus = ()=> true;
</script>
<script src=../../dist/littlejs.js></script>
<script src=smoke.js></script>
<pre id=result>PENDING</pre>
<script>
'use strict';
smokeRun(async ()=>
{
    setShowSplashScreen(false);
    setDebugWatermark(false);
    setEngineManualStep(true);
    setCanvasFixedSize(vec2(64));
    await engineInit(()=> {}, ()=> {}, ()=> {}, ()=> {}, ()=> {});
    const wait = (ms)=> new Promise((resolve)=> setTimeout(resolve, ms));
    audioContext.state === 'running' || await audioContext.resume();
    check('the audio context runs', audioContext.state === 'running', audioContext.state);

    // everything through an analyser, the loudest sample a play makes; the audio runs on its own thread, late on a
    // busy machine, so a listen waits up to 2 seconds for a sound that should be heard, done once it is, and one
    // that should be silent first waits for the bus to go quiet, so the last sound's tail is not taken for it
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    setAudioMasterEffect(analyser);
    const data = new Float32Array(analyser.fftSize);
    const peakNow = ()=>
    {
        analyser.getFloatTimeDomainData(data);
        let peak = 0;
        for (const v of data) peak = Math.max(peak, Math.abs(v));
        return peak;
    };
    const quiet = async ()=>
    {
        for (let start = performance.now(), still = 0; performance.now() - start < 3e3 && still < 5;)
            await wait(20), still = peakNow() < 1e-5 ? still + 1 : 0;
    };
    const loudest = async (play, enough=Infinity, ms=2e3)=>
    {
        play();
        let peak = 0;
        for (let start = performance.now(), i = 0; (i++ < 10 || performance.now() - start < ms) && peak <= enough;)
            await wait(20), peak = Math.max(peak, peakNow());
        return peak;
    };
    const sound = new Sound([1,,440,,.2,.2]); // a plain tone
    check('a zzfx sound is heard', await loudest(()=> sound.play(), .01) > .01);
    await quiet();
    check('a negative volume is silent', await loudest(()=> playSamples(sound.sampleChannels, -1), 1e-4, 400) < 1e-4);

    // each effect in the path, heard on an analyser only that effect reaches, so a sound that went round it to the
    // master is not heard there; fully wet, so the dry path does not carry it
    const heardThrough = async (tone, effect)=>
    {
        const own = audioContext.createAnalyser();
        own.fftSize = 2048;
        effect.connect(own);
        tone.output = effect;
        let peak = 0;
        const data = new Float32Array(own.fftSize);
        tone.play();
        for (let i = 0; i < 10; ++i)
        {
            await wait(20);
            own.getFloatTimeDomainData(data);
            for (const v of data) peak = Math.max(peak, Math.abs(v));
        }
        tone.output = undefined;
        effect.disconnect();
        return peak;
    };
    for (const [name, make] of [['filter', ()=> new AudioFilter('lowpass', 20000)],
        ['reverb', ()=> new AudioReverb(.5, 2, 1)], ['delay', ()=> new AudioDelay(.1, .3, 1)],
        ['distortion', ()=> new AudioDistortion(.5)], ['compressor', ()=> new AudioCompressor()]])
    {
        await wait(300);
        check('heard through ' + name + ' alone', await heardThrough(sound, make()) > .005);
    }
    // a 2000 Hz tone through a lowpass at 200 Hz is much quieter than through one at 20000 Hz
    const high = new Sound([1,,2000,,.2,.2]);
    const through = async (cutoff)=> { await wait(300); return heardThrough(high, new AudioFilter('lowpass', cutoff)); };
    const open = await through(20000), shut = await through(200);
    check('a lowpass below a tone takes it away', shut < open * .3, shut.toFixed(4) + ' against ' + open.toFixed(4));

    // a looping play stopped goes quiet
    await wait(300);
    const instance = sound.play(undefined, 1, 1, 1, true);
    await wait(100);
    check('a loop plays', instance.isPlaying());
    instance.stop();
    await quiet();
    check('and stops', !instance.isPlaying() && await loudest(()=> {}, 1e-3, 400) < 1e-3);
    setAudioMasterEffect();
});
</script>
