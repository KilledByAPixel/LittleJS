<!DOCTYPE html><meta charset=utf-8>
<title>LittleJS smoke: the 3D editor's scene box</title>
<script src=../../dist/littlejs.js></script>
<script src=smoke.js></script>
<pre id=result>PENDING</pre>
<div id=box></div>
<script>
'use strict';

// the 3D editor's scene box: a field edited right after another, while the box keeps the focus and so is not made
// again, changes its own setting and leaves the one edited before as it was set
smokeRun(async ()=>
{
    setShowSplashScreen(false);
    setHeadlessMode(true); // only the box is under test, nothing is drawn
    setEngineManualStep(true);
    await engineInit(()=> new Render3DPlugin);
    localStorage.removeItem('LittleJS editor 3D ' + location.pathname);
    const level = {objects: [], scene: {sky: ['#ff0000', '#00ff00', '#0000ff'], sunDirection: [0, 1, 1], fog: [3, 30]}};
    level3DLoad(level);
    const box = document.getElementById('box');
    editor3DSceneUpdate(box);

    // the inputs of the row with a name, and an edit of one as a person makes it: focused, changed, let go
    const inputs = (name)=> [...box.querySelectorAll('label')].find((l)=> l.textContent.startsWith(name))
        .querySelectorAll('input');
    const edit = (input, value)=>
    {
        input.focus();
        editor3DSceneUpdate(box); // a frame goes by with the box in focus
        input.value = value;
        input.dispatchEvent(new Event('input'));
        input.dispatchEvent(new Event('change'));
    };

    const [fogStart, fogEnd] = inputs('Fog start');
    edit(fogStart, '10');
    check('fog start is set', level.scene.fog.join() === '10,30', level.scene.fog);
    edit(fogEnd, '70');
    check('fog end right after it keeps the start', level.scene.fog.join() === '10,70', level.scene.fog);

    const top = inputs('Sky top')[0], bottom = inputs('Sky bottom')[0];
    edit(top, '#111111');
    edit(bottom, '#222222');
    check('a sky color right after another keeps the first', level.scene.sky.join() === '#111111,#00ff00,#222222',
        level.scene.sky);

    const around = inputs('Sun around')[0], height = inputs('Sun height')[0];
    edit(around, '90');
    edit(height, '30');
    const angles = editor3DSunAngles(level.scene.sunDirection);
    check('the sun\'s height right after its turn keeps the turn', angles.join() === '90,30', angles);
    check('each edit is one undo', editor3DUndoList.length === 6, editor3DUndoList.length);

    // the sky box field takes six urls by commas, blob urls of a small image since a data url has commas of its own;
    // Reflect it makes them the environment too, which then follows the sky box; a count other than six is refused
    const blob = await new Promise((resolve)=>
    {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 4;
        canvas.toBlob(resolve);
    });
    const six = (n)=> [...Array(n)].map(()=> URL.createObjectURL(blob));
    const first = six(6), second = six(6);
    edit(inputs('Sky box')[0], first.join(', '));
    check('six urls are the sky box', level.scene.skyBox?.join() === first.join(), level.scene.skyBox);
    editor3DSceneUpdate(box); // a frame goes by, the box made again with the toggle a sky box brings
    const reflect = inputs('Reflect it')[0];
    reflect.checked = true;
    reflect.dispatchEvent(new Event('change'));
    editor3DSceneUpdate(box);
    check('reflect it makes them the environment', level.scene.environment?.join() === first.join());
    edit(inputs('Sky box')[0], second.join(', '));
    check('the environment follows the sky box it reflects', level.scene.environment?.join() === second.join());
    edit(inputs('Sky box')[0], six(5).join(', '));
    check('five urls are refused', level.scene.skyBox.join() === second.join() &&
        inputs('Sky box')[0].value === second.join(', '));
    // the images load in the background, however long a busy machine takes, up to a few seconds
    for (let wait = 0; wait < 100 && !(render3D.skyBox instanceof CubeMap); ++wait)
        await new Promise((resolve)=> setTimeout(resolve, 50));
    check('the sky box loads as a cube map', render3D.skyBox instanceof CubeMap && render3D.environment === render3D.skyBox);

    // data urls have a comma of their own, so a comma and a space between them
    const dataUrls = [...Array(6)].map((_, i)=> 'data:image/png;base64,' + 'A'.repeat(i + 1));
    editor3DSceneUpdate(box);
    edit(inputs('Sky box')[0], dataUrls.join(', '));
    check('six data urls are the sky box', level.scene.skyBox?.join() === dataUrls.join(), level.scene.skyBox);
    editor3DSceneUpdate(box);
    edit(inputs('Sky box')[0], first.join(', ') + ',');
    check('a trailing comma is left off the last url', level.scene.skyBox?.join() === first.join(), level.scene.skyBox);

    // an environment of its own with no sky box can still be taken out
    editor3DChangeScene(({skyBox, ...rest}={})=> ({...rest, environment: second}));
    editor3DStrokeEnd();
    editor3DSceneUpdate(box);
    const own = inputs('Environment')[0];
    own.checked = false;
    own.dispatchEvent(new Event('change'));
    check('an environment with no sky box can be taken out', !level.scene.environment && !level.scene.skyBox);
});
</script>
